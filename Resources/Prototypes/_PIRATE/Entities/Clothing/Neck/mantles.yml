- type: entity
  parent: ClothingNeckBase
  id: ClothingPirateNeckCloakPirate
  name: pirate mantle
  description: A beautiful cloak that holds secrets.
  components:
  - type: Sprite
    sprite: _PIRATE/Clothing/Neck/Mantles/pirate.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingPirateHeadHatPirateHood
    requiredSlot:
    - neck
    slot: head
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}


