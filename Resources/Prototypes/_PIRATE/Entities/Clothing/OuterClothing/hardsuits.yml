#Classic pirate Hardsuit
- type: entity
  parent: [ClothingOuterHardsuitBase, BasePirateContraband]
  id: ClothingOuterHardsuitClassicPirate
  name: classic pirate hardsuit
  description: Made in the old Japanese style, it serves as a hardsuit for classic battles.
  components:
  - type: Sprite
    sprite: _PIRATE/Clothing/OuterClothing/Hardsuits/classic.rsi
  - type: Clothing
    sprite: _PIRATE/Clothing/OuterClothing/Hardsuits/classic.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.7
  - type: ClothingSpeedModifier
    walkModifier: 0.65
    sprintModifier: 0.65
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ClothingPirateHeadHelmetHardsuitClassicPirate
  - type: Tag
    tags:
    - CorgiWearable
    - Hardsuit
    - WhitelistChameleon

