- type: entity
  name: Vulp soup
  parent: FoodBowlBase
  id: FoodSoupMeatVulp
  description: You've got balls kid, BALLS!
  components:
  - type: Sprite
    sprite: _RPSX/Objects/Consumable/Food/bowl/VulpSoup.rsi
    state: vulposoup
  - type: FlavorProfile
    flavors:
      - meaty
      - funny
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 40
        reagents:
        - ReagentId: Nutriment
          Quantity: 8
        - ReagentId: Vitamin
          Quantity: 17
        - ReagentId: Water
          Quantity: 5
  - type: Tag
    tags:
    - Meat
    - Soup

- type: entity
  name: mushroom soup
  parent: FoodBowlBase
  id: FoodClamSoup
  description: A delicious and satisfying soup resembles a spider.
  components:
  - type: FlavorProfile
    flavors:
      - meaty
  - type: Sprite
    sprite: _RPSX/Objects/Consumable/Food/bowl/ClamSoup.rsi
    state: clamsoup
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
          - ReagentId: Protein
            Quantity: 9
          - ReagentId: Vitamin
            Quantity: 7
          - ReagentId: Water
            Quantity: 5
          - ReagentId: Milk
            Quantity: 4

- type: entity
  name: SlugRice
  parent: FoodBowlBase
  id: FoodSlugRice
  description: Well, it looks like slime...
  components:
  - type: FlavorProfile
    flavors:
      - rice
      - slime
  - type: Sprite
    sprite: _RPSX/Objects/Consumable/Food/bowl/SlugRice.rsi
    state: slugrice
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 40
        reagents:
        - ReagentId: Nutriment
          Quantity: 18
        - ReagentId: Vitamin
          Quantity: 7
        - ReagentId: Dexalin ##This is probably a reference to something but I don't get it
          Quantity: 6.5
        - ReagentId: Epinephrine
          Quantity: 2
  - type: Tag
    tags:
    - Meat
    - Soup
