# Rule
- type: entity
  parent: BasePiratesRule
  id: BasicPirates
  components:
  - type: BasicPiratesRule
    objectivesSilent: 
      BalanceObjective: 1
      StealStationAi: 1
      KidnapPersonObjective: 3
      StealItemsObjective: 3
      StealCriticalItemsObjective: 1
      TelecommunicationsDisruption: 1
    objectivesLoud: 
      BalanceObjective: 1
      CmdKidnapObjective: 1
      LightsDisruption: 1
      StealStationAi: 1
      KillPersonObjective: 4
      StealCriticalItemsObjective: 2
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    definitions:
    - prefRoles: [ PirateCaptain ]
      fallbackRoles: [ Pirate, PirateBocman ]
      spawnerPrototype: SpawnPointPirateCaptain
      startingGear: BasicPiratesGearCaptain
      # roleLoadout:
      # - RoleSurvivalNukie
      components:
      - type: Pirate
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateElite
        nameFormat: name-format-nukie-commander
      - type: NpcFactionMember
        factions:
        - Syndicate
      mindRoles:
      - MindRolePirateCaptain
    - prefRoles: [ PirateBocman ]
      fallbackRoles: [ Pirate, PirateCaptain ]
      spawnerPrototype: SpawnPointPirateBocman
      startingGear: BasicPiratesGearBocman
      # roleLoadout:
      # - RoleSurvivalNukie
      components:
      - type: Pirate
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateNormal
        nameFormat: name-format-nukie-agent
      - type: NpcFactionMember
        factions:
        - Syndicate
      mindRoles:
      - MindRolePirateBocman
    - prefRoles: [ Pirate ]
      fallbackRoles: [ PirateCaptain, PirateBocman ]
      spawnerPrototype: SpawnPointPirate
      max: 5
      playerRatio: 10
      startingGear: BasicPiratesGear
      # roleLoadout:
      # - RoleSurvivalNukie
      components:
      - type: Pirate
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateNormal
        nameFormat: name-format-nukie-operator
      - type: NpcFactionMember
        factions:
        - Syndicate
      mindRoles:
      - MindRolePirate
