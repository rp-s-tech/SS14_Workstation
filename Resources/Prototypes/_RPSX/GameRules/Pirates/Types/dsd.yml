# Rule
- type: entity
  parent: BasePiratesRule
  id: DwarvesPirates
  components:
  - type: DwarvesPiratesRule
    objectivesSilent: 
      BalanceObjective: 1
      StealStationAi: 1
      KidnapPersonObjective: 3
      StealItemsObjective: 3
      StealCriticalItemsObjective: 1
      TelecommunicationsDisruption: 1
    objectivesLoud: 
      BalanceObjective: 1
      CmdKidnapObjective: 1
      LightsDisruption: 1
      StealStationAi: 1
      KillPersonObjective: 4
      StealCriticalItemsObjective: 2
  - type: AntagLoadProfileRule
    speciesOverride: Dwarf
    speciesOverrideBlacklist:
    - Vox
    - Vulpkanin
    - Arachnid
    - Diona
    - Moth
    - Reptilian
    - SlimePerson
    - Human
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    definitions:
    - prefRoles: [ PirateCaptain ]
      fallbackRoles: [ Pirate, PirateBocman ]
      spawnerPrototype: SpawnPointPirateCaptain
      startingGear: DSDPiratesGearCaptain
      # roleLoadout:
      # - RoleSurvivalNukie
      components:
      - type: Pirate
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateElite
        nameFormat: name-format-nukie-commander
      - type: NpcFactionMember
        factions:
        - Syndicate
      mindRoles:
      - MindRolePirateCaptain
    - prefRoles: [ PirateBocman ]
      fallbackRoles: [ Pirate, PirateCaptain ]
      spawnerPrototype: SpawnPointPirateBocman
      startingGear: DSDPiratesGearBocman
      # roleLoadout:
      # - RoleSurvivalNukie
      components:
      - type: Pirate
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateNormal
        nameFormat: name-format-nukie-agent
      - type: NpcFactionMember
        factions:
        - Syndicate
      mindRoles:
      - MindRolePirateBocman
    - prefRoles: [ Pirate ]
      fallbackRoles: [ PirateCaptain, PirateBocman ]
      spawnerPrototype: SpawnPointPirate
      max: 5
      playerRatio: 10
      startingGear: DSDPiratesGear
      # roleLoadout:
      # - RoleSurvivalNukie
      components:
      - type: Pirate
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateNormal
        nameFormat: name-format-nukie-operator
      - type: NpcFactionMember
        factions:
        - Syndicate
      mindRoles:
      - MindRolePirate

- type: gamePreset
  id: DwarvesPirates
  alias:
  - dwarvesPirates
  name: dwarvesPirates-title
  showInVote: false 
  description: dwarvesPirates-description
  rules:
  - BasicStationEventScheduler
  - MeteorSwarmScheduler
  - SpaceTrafficControlEventScheduler
  - BasicRoundstartVariation
  - DwarvesPirates