- type: entity
  parent: BaseAction
  id: ActionCyberArmChooseAttachmnet
  name: Choose attachment
  description: Choose your attachment and be stylish.
  components:
  - type: Action
    useDelay: 2
    itemIconStyle: BigAction
    # icon:
    #   sprite: Interface/Actions/changeling.rsi
    #   state: armblade
  - type: InstantAction
    event: !type:ToggleIntrinsicUIEvent { key: enum.CyberHandChooseItemUIKey.Key }


- type: entity
  parent: BaseAction
  id: ActionCyberArmShootLaser
  name: Make a shot
  description: "Shoot 'em all!"
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    raiseOnUser: true
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/fireball.ogg
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: fireball
  - type: TargetAction
    range: 60
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: BulletLaser

- type: entity
  id: CyberHand
  parent: LeftHandSynth
  components:
  - type: CyberHand