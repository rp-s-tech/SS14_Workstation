# Rule
- type: entity
  parent: BasePiratesRule
  id: CyberCorpPirates
  components:
  - type: AntagLoadProfileRule
    speciesOverride: Reptilian
    speciesOverrideBlacklist:
    - Vox
    - Vulpkanin
    - Arachnid
    - Diona
    - Moth
    - SlimePerson
    - Dwarf
  - type: LoadMapRule
    mapPath: /Maps/RPSXSecrets/Pirates/piratesector.yml
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    definitions:
    - prefRoles: [ PirateCaptain ]
      fallbackRoles: [ Pirate, PirateBocman ]
      spawnerPrototype: SpawnPointPirateCaptain
      startingGear: CyberCorpPiratesGearCaptain
      # roleLoadout:
      # - RoleSurvivalNukie
      components:
      - type: Pirate
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateElite
        nameFormat: name-format-nukie-commander
      - type: NpcFactionMember
        factions:
        - Syndicate
      mindRoles:
      - MindRolePirateCaptain
    - prefRoles: [ PirateBocman ]
      fallbackRoles: [ Pirate, PirateCaptain ]
      spawnerPrototype: SpawnPointPirateBocman
      startingGear: CyberCorpPiratesGearBocman
      # roleLoadout:
      # - RoleSurvivalNukie
      components:
      - type: Pirate
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateNormal
        nameFormat: name-format-nukie-agent
      - type: NpcFactionMember
        factions:
        - Syndicate
      mindRoles:
      - MindRolePirateBocman
    - prefRoles: [ Pirate ]
      fallbackRoles: [ PirateCaptain, PirateBocman ]
      spawnerPrototype: SpawnPointPirate
      max: 5
      playerRatio: 10
      startingGear: CyberCorpPiratesGear
      # roleLoadout:
      # - RoleSurvivalNukie
      components:
      - type: Pirate
      - type: RandomMetadata
        nameSegments:
        - NamesSyndicateNormal
        nameFormat: name-format-nukie-operator
      - type: NpcFactionMember
        factions:
        - Syndicate
      mindRoles:
      - MindRolePirate
